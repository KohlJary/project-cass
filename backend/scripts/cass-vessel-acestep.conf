# Drop-in configuration for cass-vessel to depend on ACE-Step
#
# Install with:
#   sudo mkdir -p /etc/systemd/system/cass-vessel.service.d/
#   sudo cp cass-vessel-acestep.conf /etc/systemd/system/cass-vessel.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart cass-vessel
#
# This makes cass-vessel wait for ACE-Step to start first.
# Using "Wants" instead of "Requires" means cass-vessel will still start
# even if ACE-Step fails (music features will just be unavailable).

[Unit]
Wants=acestep.service
After=acestep.service
