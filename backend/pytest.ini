[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Hard per-test limit (pytest-timeout). A hung websocket or blocked TestClient
# call fails that one test with a stack dump instead of eating the CI job.
# Override for one test with @pytest.mark.timeout(N).
timeout = 60
addopts = -v --tb=short
markers =
    unit: Fast isolated tests
    integration: Tests with real file I/O
    slow: Long-running tests
    tts: Needs the piper/pydub text-to-speech stack
    smoke: End-to-end smoke batteries (boot the app, full chat turn, routability); see tests/README.md
